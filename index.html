<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FretFlow | Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="glass">
            <div class="logo">FretFlow</div>
            <div class="user-info">
                <div class="progress-container">
                    <span class="status-label">Overall Progress</span>
                    <div class="progress-bar-bg">
                        <div id="progress-fill" class="progress-bar-fill"></div>
                    </div>
                    <span id="progress-text" style="font-weight: 700; font-size: 0.85rem;">0%</span>
                </div>
                <div class="role-badge">Student</div>
                <div class="profile-pic" style="width: 40px; height: 40px; border-radius: 50%; background: #2a2a30; border: 2px solid var(--primary-color);"></div>
            </div>
        </header>

        <!-- Sidebar / History -->
        <aside class="sidebar">
            <div class="history-panel glass">
                <h3><i class="fas fa-history"></i> Practice History</h3>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <!-- Filtering System -->
            <div class="filters glass" style="padding: 15px;">
                <div class="search-wrapper">
                    <input type="text" id="lesson-search" placeholder="Search lessons (e.g. 'Basics')...">
                </div>
                <select id="difficulty-filter" class="filter-select">
                    <option value="all">All Difficulties</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <select id="status-filter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="available">Available</option>
                    <option value="completed">Completed</option>
                    <option value="locked">Locked</option>
                </select>
            </div>

            <!-- Lesson Grid -->
            <div id="lesson-grid" class="lesson-grid">
                <!-- Lesson cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Interactive Fretboard View (Hidden by default) -->
    <section id="interactive-view">
        <button class="practice-btn close-practice" id="close-fretboard">
            <i class="fas fa-times"></i> Back to Dashboard
        </button>
        <h2 id="active-lesson-title" style="font-size: 2.5rem; margin-bottom: 10px;">String Basics</h2>
        <p style="color: var(--text-secondary); margin-bottom: 40px;">Interactive Fretboard Session</p>
        
        <div class="fretboard-container" id="fretboard">
            <div class="fretboard glass" id="guitar-fretboard">
                <!-- Strings and frets will be generated by JS -->
            </div>
        </div>

        <div id="exercise-info" style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <div style="font-size: 1.1rem; color: var(--primary-color);">
                Target Note: <span id="target-note" style="font-weight: 700;">---</span>
            </div>
            <div id="mic-status" class="glass" style="padding: 10px 20px; border-radius: 12px; font-size: 0.9rem; color: var(--text-secondary);">
                <i class="fas fa-microphone-slash"></i> Microphone: Off
            </div>
            <div id="current-pitch" style="font-size: 2rem; font-weight: 700; color: white;">--</div>
        </div>

        <button class="practice-btn" id="finish-practice" style="padding: 15px 60px; font-size: 1.1rem;">
            Finish Practice Session
        </button>
    </section>

    <!-- Admin Panel -->
    <div class="admin-fab" id="admin-fab" title="Admin Panel">
        <i class="fas fa-plus"></i>
    </div>

    <div class="modal-overlay" id="admin-modal">
        <div class="admin-modal glass">
            <h2>Create New Lesson</h2>
            <form id="lesson-form">
                <div class="form-group">
                    <label>Lesson Title</label>
                    <input type="text" id="new-lesson-title" required placeholder="e.g. A Minor Scale">
                </div>
                <div class="form-group">
                    <label>Difficulty</label>
                    <select id="new-lesson-diff">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="new-lesson-desc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Target Note (for YIN)</label>
                    <input type="text" id="new-lesson-note" placeholder="e.g. E2, A2, G3">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="practice-btn" style="flex: 1;">Save Lesson</button>
                    <button type="button" class="practice-btn" id="close-modal" style="flex: 1; background: var(--locked);">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="pitchDetector.js"></script>
    <script src="script.js"></script>
</body>
</html>
