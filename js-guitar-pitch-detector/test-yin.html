<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YIN Algorithm Tests</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
        h1 { color: #4af; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-right: 10px; }
        #results { background: #111; padding: 20px; border-radius: 5px; white-space: pre; }
        .pass { color: #4f4; }
        .fail { color: #f44; }
        #status { font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>YIN Pitch Detection - Test Runner</h1>

    <div class="controls">
        <button id="runTests">Run Tests</button>
        <button id="runManual">Manual Audio Test</button>
    </div>

    <div id="status">Click "Run Tests" to execute unit tests</div>
    <div id="results"></div>

    <script src="app.js"></script>
    <script src="test-runner.js"></script>
    <script src="test-utils.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');

        function updateStatus(msg, type = '') {
            statusEl.textContent = msg;
            statusEl.className = type;
        }

        function runTests() {
            clearResults();
            resultsEl.textContent = '';
            updateStatus('Running tests...', '');

            console.clear();

            try {
                describe('yinDetector', () => {
                    it('detects E2 (82.41 Hz) within 2Hz tolerance', () => {
                        const buffer = createTestBuffer(82.41, 44100, 0.1, true);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 82.41, 3, 'Frequency detection: ');
                    });

                    it('detects A4 (440 Hz) within 2Hz tolerance', () => {
                        const buffer = createTestBuffer(440, 44100, 0.1, true);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 440, 2, 'Frequency detection: ');
                    });

                    it('detects A4 with guitar-like harmonics', () => {
                        const buffer = generateGuitarLike(440, 44100, 0.1, [1, 0.5, 0.25]);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 440, 5, 'Harmonics detection: ');
                    });

                    it('rejects silence (returns 0)', () => {
                        const buffer = generateSilence(2048);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 0, 0, 'Silence rejection: ');
                    });

                    it('returns 0 for low amplitude noise', () => {
                        const buffer = generateNoise(44100, 0.1, 0.001);
                        const freq = yinDetector(buffer, 44100);
                        // Should return 0 because below absolute threshold of 0.5
                    });

                    it('detects 1000 Hz within tolerance', () => {
                        const buffer = createTestBuffer(1000, 44100, 0.1, true);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 1000, 5, 'High frequency: ');
                    });

                    it('detects 220 Hz (A3) within tolerance', () => {
                        const buffer = createTestBuffer(220, 44100, 0.1, true);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 220, 3, 'Mid frequency: ');
                    });
                });

                describe('parabolicInterpolation', () => {
                    it('returns refined tau for middle value', () => {
                        // Create a yinBuffer with a minimum at index 50
                        const yinBuffer = new Array(100).fill(1);
                        yinBuffer[50] = 0.1;
                        yinBuffer[49] = 0.3;
                        yinBuffer[51] = 0.3;
                        const result = parabolicInterpolation(yinBuffer, 50);
                        // Should be between 49 and 51, not exactly 50
                    });

                    it('returns tau for boundary case (x1 < 0)', () => {
                        const yinBuffer = new Array(10).fill(0.5);
                        const result = parabolicInterpolation(yinBuffer, 0);
                        assertEquals(result, 0, 0, 'Boundary x1: ');
                    });

                    it('returns tau for boundary case (x3 >= length)', () => {
                        const yinBuffer = new Array(10).fill(0.5);
                        const result = parabolicInterpolation(yinBuffer, 8);
                        assertEquals(result, 8, 0, 'Boundary x3: ');
                    });
                });

                describe('frequencyToNote', () => {
                    it('converts A4 (440 Hz) to A4', () => {
                        const note = frequencyToNote(440);
                        assertEquals(note, 'A4', 0, 'A4: ');
                    });

                    it('converts E2 (82.41 Hz) to E2', () => {
                        const note = frequencyToNote(82.41);
                        assertEquals(note, 'E2', 0, 'E2: ');
                    });

                    it('converts C4 (261.63 Hz) to C4', () => {
                        const note = frequencyToNote(261.63);
                        assertEquals(note, 'C4', 0, 'C4: ');
                    });
                });

                describe('Bug fixes verification', () => {
                    it('no out-of-bounds for tau=1000', () => {
                        const buffer = createTestBuffer(200, 44100, 0.1, true);
                        const freq = yinDetector(buffer, 44100);
                    });

                    it('handles low frequencies correctly', () => {
                        const buffer = createTestBuffer(65, 44100, 0.15, true);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 65, 5, 'Very low freq: ');
                    });
                });

                describe('Guitar string tuning (high precision)', () => {
                    const guitarStrings = [
                        { freq: 82.41, name: 'E2', tolerance: 0.5 },
                        { freq: 110.00, name: 'A2', tolerance: 0.5 },
                        { freq: 146.83, name: 'D3', tolerance: 0.5 },
                        { freq: 196.00, name: 'G3', tolerance: 0.5 },
                        { freq: 246.94, name: 'B3', tolerance: 0.5 },
                        { freq: 329.63, name: 'E4', tolerance: 0.5 },
                    ];

                    guitarStrings.forEach(({ freq, name, tolerance }) => {
                        it(`detects ${name} (${freq} Hz) within ${tolerance} Hz`, () => {
                            const buffer = createTestBuffer(freq, 44100, 0.1);
                            const detected = yinDetector(buffer, 44100);
                            assertEquals(detected, freq, tolerance, `${name}: `);
                        });
                    });
                });

                describe('Frequency precision (sub-Hz accuracy)', () => {
                    const precisionTests = [
                        { freq: 440, name: 'A4' },
                        { freq: 220, name: 'A3' },
                        { freq: 880, name: 'A5' },
                        { freq: 82.41, name: 'E2' },
                        { freq: 493.88, name: 'B4' },
                    ];

                    precisionTests.forEach(({ freq, name }) => {
                        it(`detects ${name} (${freq} Hz) with < 0.5 Hz error`, () => {
                            const buffer = createTestBuffer(freq, 44100, 0.15);
                            const detected = yinDetector(buffer, 44100);
                            const error = Math.abs(detected - freq);
                            if (error > 0.5) {
                                throw new Error(`${name}: expected ${freq}, got ${detected.toFixed(2)} (error: ${error.toFixed(3)} Hz)`);
                            }
                        });
                    });
                });

                describe('Note range (C2 to C6)', () => {
                    const notes = [
                        { freq: 65.41, name: 'C2' },
                        { freq: 130.81, name: 'C3' },
                        { freq: 261.63, name: 'C4' },
                        { freq: 523.25, name: 'C5' },
                        { freq: 1046.50, name: 'C6' },
                    ];

                    notes.forEach(({ freq, name }) => {
                        it(`detects ${name} (${freq} Hz)`, () => {
                            const buffer = createTestBuffer(freq, 44100, 0.1);
                            const detected = yinDetector(buffer, 44100);
                            assertEquals(detected, freq, 2, `${name}: `);
                        });
                    });
                });

                describe('Signal duration (real-time simulation)', () => {
                    const durations = [0.05, 0.1, 0.2, 0.3];

                    durations.forEach(duration => {
                        it(`detects 440 Hz with ${duration}s buffer`, () => {
                            const buffer = createTestBuffer(440, 44100, duration);
                            const detected = yinDetector(buffer, 44100);
                            assertEquals(detected, 440, 1, `Duration ${duration}s: `);
                        });
                    });
                });

                describe('Noise robustness', () => {
                    const noiseLevels = [0.001, 0.01, 0.05];

                    noiseLevels.forEach(amplitude => {
                        it(`detects 440 Hz with noise amplitude ${amplitude}`, () => {
                            const buffer = generateNoise(44100, 0.1, amplitude);
                            const signal = generateSine(440, 44100, 0.1);
                            // Mix signal with noise
                            for (let i = 0; i < buffer.length; i++) {
                                buffer[i] = signal[i] + buffer[i];
                            }
                            const detected = yinDetector(buffer, 44100);
                            assertEquals(detected, 440, 5, `Noise ${amplitude}: `);
                        });
                    });
                });

                describe('FrequencyToNote full range', () => {
                    const noteTests = [
                        { freq: 440, expected: 'A4' },
                        { freq: 261.63, expected: 'C4' },
                        { freq: 329.63, expected: 'E4' },
                        { freq: 392.00, expected: 'G4' },
                        { freq: 493.88, expected: 'B4' },
                        { freq: 82.41, expected: 'E2' },
                        { freq: 110.00, expected: 'A2' },
                        { freq: 146.83, expected: 'D3' },
                        { freq: 196.00, expected: 'G3' },
                        { freq: 246.94, expected: 'B3' },
                    ];

                    noteTests.forEach(({ freq, expected }) => {
                        it(`converts ${freq} Hz to ${expected}`, () => {
                            const note = frequencyToNote(freq);
                            assertEquals(note, expected, 0, `${freq}Hz: `);
                        });
                    });
                });

                describe('Confidence Scoring', () => {
                    const amplitudes = [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0];

                    amplitudes.forEach(amplitude => {
                        it(`detects 440Hz with amplitude ${amplitude}`, () => {
                            const buffer = new Float32Array(4410);
                            for (let i = 0; i < buffer.length; i++) {
                                buffer[i] = Math.sin(2 * Math.PI * 440 * i / 44100) * amplitude;
                            }
                            const freq = yinDetector(buffer, 44100);
                            if (amplitude >= 0.05) {
                                // Strong enough signal should be detected
                                assertEquals(freq, 440, 5, `Amp ${amplitude}: `);
                            } else {
                                // Very weak signal returns 0 due to confidence threshold
                            }
                        });
                    });

                    it('silence returns 0 due to low confidence', () => {
                        const buffer = new Float32Array(2048).fill(0);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 0, 0, 'Silence: ');
                    });
                });

                describe('Octave Correction', () => {
                    it('does not modify clean 440Hz signal', () => {
                        const buffer = createTestBuffer(440, 44100, 0.1);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 440, 1, 'Clean signal: ');
                    });

                    it('does not modify clean 82Hz signal', () => {
                        const buffer = createTestBuffer(82.41, 44100, 0.1);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 82.41, 2, 'Low frequency: ');
                    });

                    it('corrects when strong sub-harmonic present', () => {
                        // Create signal with fundamental + very strong sub-harmonic (octave below)
                        const buffer = new Float32Array(4410);
                        for (let i = 0; i < buffer.length; i++) {
                            // 220Hz fundamental + strong 110Hz sub-harmonic
                            buffer[i] = 0.5 * Math.sin(2 * Math.PI * 220 * i / 44100)
                                      + 1.0 * Math.sin(2 * Math.PI * 110 * i / 44100);
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should detect 220 or 110 depending on which is stronger
                        // Either is acceptable as valid octave correction behavior
                    });
                });

                describe('Edge Cases', () => {
                    it('handles 40Hz (below guitar range)', () => {
                        const buffer = createTestBuffer(40, 44100, 0.2);
                        const freq = yinDetector(buffer, 44100);
                        // Should still detect, might be slightly off
                    });

                    it('handles 2000Hz (above guitar range)', () => {
                        const buffer = createTestBuffer(2000, 44100, 0.1);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 2000, 10, 'High freq: ');
                    });

                    it('handles very short duration (20ms)', () => {
                        const buffer = createTestBuffer(440, 44100, 0.02);
                        const freq = yinDetector(buffer, 44100);
                        // 20ms = 882 samples at 44100Hz
                        // Should still detect though possibly less accurate
                    });

                    it('handles 110Hz (A2 string)', () => {
                        const buffer = createTestBuffer(110, 44100, 0.1);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 110, 2, 'A2: ');
                    });

                    it('handles 246Hz (B3 string)', () => {
                        const buffer = createTestBuffer(246.94, 44100, 0.1);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 246.94, 2, 'B3: ');
                    });
                });

                describe('getOptimalBufferSize', () => {
                    it('returns 4096 samples', () => {
                        assertEquals(getOptimalBufferSize(), 4096, 0, 'Buffer size: ');
                    });
                });

                describe('Stress Tests', () => {
                    it('handles rapid frequency ramp', () => {
                        // Simulate frequency sweep from 100Hz to 500Hz
                        const buffer = new Float32Array(4410);
                        for (let i = 0; i < buffer.length; i++) {
                            const freq = 100 + (400 * i / buffer.length);
                            buffer[i] = Math.sin(2 * Math.PI * freq * i / 44100);
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should detect somewhere in the middle range
                    });

                    it('handles very low amplitude signal', () => {
                        const buffer = new Float32Array(4410).fill(0).map(() => (Math.random() - 0.5) * 0.005);
                        // Add a weak 440Hz component
                        for (let i = 0; i < buffer.length; i++) {
                            buffer[i] += 0.02 * Math.sin(2 * Math.PI * 440 * i / 44100);
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should detect the 440 component if strong enough
                    });
                });

                describe('correctOctave Unit Tests', () => {
                    it('returns same freq when no octave error (clean signal)', () => {
                        // Create mock yinBuffer with current period as clear minimum
                        const yinBuffer = new Array(200).fill(0.8);
                        yinBuffer[50] = 0.1; // Current minimum at tau=50
                        yinBuffer[25] = 0.7; // Octave down (worse confidence)
                        yinBuffer[100] = 0.7; // Octave up (worse confidence)
                        const result = correctOctave(44100 / 50, yinBuffer, 44100);
                        // Should NOT correct since current is clearly best
                        assertApprox(result, 882, 0.01, 'No correction: ');
                    });

                    it('does not modify frequency when current is strongest', () => {
                        const yinBuffer = new Array(200).fill(0.85);
                        yinBuffer[100] = 0.05; // Best at tau=100
                        yinBuffer[50] = 0.5;   // Octave down - worse
                        yinBuffer[200] = 0.5;  // Octave up - worse
                        const result = correctOctave(44100 / 100, yinBuffer, 44100);
                        // Should keep 441 Hz (sampleRate / 100)
                        assertApprox(result, 441, 1, 'Current is best: ');
                    });
                });

                describe('Performance', () => {
                    it('yinDetector completes in < 100ms for 4096 samples', () => {
                        const buffer = createTestBuffer(440, 44100, 0.1);
                        const start = performance.now();
                        yinDetector(buffer, 44100);
                        const elapsed = performance.now() - start;
                        assertEquals(elapsed < 100, true, true, 'Single run: ');
                    });

                    it('100 iterations completes in < 5 seconds', () => {
                        const buffer = createTestBuffer(440, 44100, 0.1);
                        const start = performance.now();
                        for (let i = 0; i < 100; i++) {
                            yinDetector(buffer, 44100);
                        }
                        const elapsed = performance.now() - start;
                        assertEquals(elapsed < 5000, true, true, '100 iterations: ');
                    });
                });

                describe('Additional Edge Cases', () => {
                    it('handles DC offset (constant signal)', () => {
                        const buffer = new Float32Array(2048).fill(0.5); // DC offset
                        const freq = yinDetector(buffer, 44100);
                        // Should return 0 (no pitch in pure DC)
                        assertEquals(freq, 0, 0, 'DC offset: ');
                    });

                    it('handles clipping/distortion', () => {
                        const buffer = createTestBuffer(440, 44100, 0.1);
                        // Clip to simulate overdrive
                        for (let i = 0; i < buffer.length; i++) {
                            buffer[i] = Math.max(-1, Math.min(1, buffer[i] * 3));
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should still detect approximately 440
                        assertEquals(freq, 440, 10, 'Clipping: ');
                    });

                    it('handles very long duration (1 second)', () => {
                        const buffer = createTestBuffer(440, 44100, 1.0);
                        const freq = yinDetector(buffer, 44100);
                        assertEquals(freq, 440, 2, 'Long duration: ');
                    });

                    it('handles mixed frequencies (simulates chord)', () => {
                        const buffer = new Float32Array(4410);
                        for (let i = 0; i < buffer.length; i++) {
                            // C4 (261Hz) + E4 (330Hz) + G4 (392Hz)
                            buffer[i] = 0.3 * Math.sin(2 * Math.PI * 261 * i / 44100)
                                      + 0.3 * Math.sin(2 * Math.PI * 330 * i / 44100)
                                      + 0.3 * Math.sin(2 * Math.PI * 392 * i / 44100);
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should detect one of the components (not 0)
                        // Lowest or strongest - depends on YIN behavior
                        const validFreqs = [261, 330, 392];
                        const detectedValid = validFreqs.some(f => Math.abs(freq - f) < 10);
                        if (!detectedValid) {
                            console.log('Chord detected frequency:', freq, '(one of 261/330/392 expected)');
                        }
                    });

                    it('handles signal with slight frequency modulation', () => {
                        // Vibrato-like effect
                        const buffer = new Float32Array(4410);
                        for (let i = 0; i < buffer.length; i++) {
                            const mod = 1 + 0.02 * Math.sin(2 * Math.PI * 5 * i / 44100);
                            buffer[i] = Math.sin(2 * Math.PI * 440 * mod * i / 44100);
                        }
                        const freq = yinDetector(buffer, 44100);
                        // Should detect near 440 despite modulation
                        assertEquals(freq, 440, 10, 'Modulated: ');
                    });
                });

                const summary = printSummary();

                // Update UI
                let output = 'TEST RESULTS\n';
                output += '============\n\n';

                const passed = summary.results.filter(r => r.passed);
                const failed = summary.results.filter(r => !r.passed);

                passed.forEach(r => {
                    output += `✓ ${r.suite}: ${r.name}\n`;
                });

                if (failed.length > 0) {
                    output += '\nFAILED:\n';
                    failed.forEach(r => {
                        output += `✗ ${r.suite}: ${r.name}\n      Error: ${r.error}\n`;
                    });
                }

                resultsEl.textContent = output;
                updateStatus(
                    `Summary: ${passed.length} passed, ${failed.length} failed`,
                    failed.length > 0 ? 'fail' : 'pass'
                );

            } catch (e) {
                console.error('Test runner error:', e);
                updateStatus('Error running tests: ' + e.message, 'fail');
            }
        }

        // Manual audio test using Web Audio API
        async function runManualTest() {
            updateStatus('Starting manual test...', '');
            console.log('Starting manual audio test...');

            try {
                const audioContext = new AudioContext();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const microphone = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                microphone.connect(analyser);

                const dataArray = new Float32Array(analyser.frequencyBinCount);

                // Update every 100ms
                const interval = setInterval(() => {
                    analyser.getFloatTimeDomainData(dataArray);

                    // Check volume
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i] * dataArray[i];
                    }
                    const rms = Math.sqrt(sum / dataArray.length);
                    const volume = rms * 100;

                    if (volume > 1) {
                        const freq = yinDetector(dataArray, audioContext.sampleRate);
                        const note = freq > 0 ? frequencyToNote(freq) : '--';
                        updateStatus(`Freq: ${freq.toFixed(1)} Hz | Note: ${note} | Volume: ${volume.toFixed(1)}%`, 'pass');
                    } else {
                        updateStatus(`Listening... Volume: ${volume.toFixed(1)}%`, '');
                    }
                }, 100);

                // Stop after 30 seconds
                setTimeout(() => {
                    clearInterval(interval);
                    stream.getTracks().forEach(track => track.stop());
                    audioContext.close();
                    updateStatus('Manual test completed', '');
                }, 30000);

            } catch (e) {
                updateStatus('Manual test error: ' + e.message, 'fail');
            }
        }

        document.getElementById('runTests').addEventListener('click', runTests);
        document.getElementById('runManual').addEventListener('click', runManualTest);
    </script>
</body>
</html>
